<text x="281" y="976" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d8eae6" letter-spacing="0">Order router loads</text>
<text x="281" y="1002" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d8eae6" letter-spacing="0">catalog prices and HSN.</text>
