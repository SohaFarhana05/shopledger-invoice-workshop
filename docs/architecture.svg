<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title"><title id="title">ShopLedger architecture and order flow</title>
<rect x="0" y="0" width="1440" height="1080" rx="0" fill="#f9faf6" stroke="none"/>
